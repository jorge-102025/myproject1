<div>
    <h1>Course Enrollment System</h1>
    <form id="enrollmentForm">
        <input type="text" placeholder="Student ID" required />
        <input type="text" placeholder="Course ID" required />
        <input type="text" placeholder="Semester" required />
        <button type="submit">Enroll</button>
    </form>
    <form id="instructorAssignmentForm">
        <input type="text" placeholder="Instructor ID" required />
        <input type="text" placeholder="Department ID" required />
        <input type="text" placeholder="Course ID" required />
        <button type="submit">Assign Instructor</button>
    </form>
    <button id="generateSchedule">Generate Schedule</button>
</div>
