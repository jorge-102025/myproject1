!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Company Portal</title>
<style>
  /* Reset & base */
  * {
    box-sizing: border-box;
  }
  body, html {
    margin: 0; padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f4f7f9;
    color: #333;
    height: 100vh;
    overflow: hidden;
  }

  /* Container */
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-height: 600px;
    max-width: 350px;
    margin: 0 auto;
    border: 1px solid #ddd;
    background: white;
    box-shadow: 0 0 15px rgba(0,0,0,0.1);
  }

  /* Navigation Bar */
  nav {
    display: flex;
    background: #1e90ff;
    color: white;
    justify-content: space-around;
    align-items: center;
    padding: 0.7rem 0;
    font-weight: 600;
    user-select: none;
  }
  nav button {
    background: transparent;
    border: none;
    color: white;
    font-size: 1rem;
    cursor: pointer;
    padding: 0.5rem 0.8rem;
    border-radius: 3px;
    transition: background-color 0.3s ease;
  }
  nav button:hover, nav button.active {
    background: #004a99;
  }
  nav button:focus {
    outline: none;
  }

  /* Content area */
  main {
    flex-grow: 1;
    padding: 1rem 1.25rem 1.75rem;
    overflow-y: auto;
  }

  /* Content headings */
  main h1 {
    margin-top: 0;
    font-size: 1.6rem;
    color: #0056b3;
    margin-bottom: 0.5rem;
  }
  main p {
    line-height: 1.4;
  }

  /* Login section styling */
  #login-section {
    border-top: 1px solid #ddd;
    padding: 1rem 1.25rem;
    background: #f0f4f8;
  }
  #login-section h2 {
    margin: 0 0 0.75rem 0;
    font-size: 1.2rem;
    color: #333;
  }
  #login-section form {
    display: flex;
    flex-direction: column;
  }
  #login-section label {
    font-size: 0.9rem;
    margin-bottom: 0.3rem;
    color: #555;
  }
  #login-section input[type="text"],
  #login-section input[type="password"] {
    padding: 0.45rem 0.5rem;
    margin-bottom: 0.8rem;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 1rem;
    transition: border-color 0.2s ease-in-out;
  }
  #login-section input[type="text"]:focus,
  #login-section input[type="password"]:focus {
    border-color: #1e90ff;
    outline: none;
  }
  #login-section button {
    background-color: #1e90ff;
    border: none;
    color: white;
    padding: 0.6rem;
    font-size: 1rem;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    transition: background-color 0.3s ease;
  }
  #login-section button:hover {
    background-color: #004a99;
  }

  /* Scrollbar for main on small widths */
  main::-webkit-scrollbar {
    width: 6px;
  }
  main::-webkit-scrollbar-thumb {
    background-color: #1e90ff;
    border-radius: 3px;
  }
  main::-webkit-scrollbar-track {
    background: #e0e7f1;
  }

  /* Responsive adjustments for smaller devices */
  @media (max-width: 380px) {
    #app {
      max-width: 100vw;
      border: none;
      box-shadow: none;
    }
    main {
      padding: 0.75rem 1rem 1rem;
    }
    nav button {
      font-size: 0.9rem;
      padding: 0.4rem 0.6rem;
    }
    #login-section {
      padding: 0.85rem 1rem;
    }
  }
</style>
</head>
<body>
  <div id="app" role="main">
    <nav aria-label="Primary navigation">
      <button id="nav-home" class="active" aria-current="page">Home</button>
      <button id="nav-sales">Sales</button>
      <button id="nav-orders">Orders</button>
    </nav>
    <main id="page-content" tabindex="0" aria-live="polite">
      <!-- Dynamic content injected here -->
      <h1>Welcome to the Company Portal</h1>
      <p>This is the home page. Use the navigation above to switch between Sales and Orders pages.</p>
    </main>
    <section id="login-section" aria-label="Employee login section">
      <h2>Employee Login</h2>
      <form id="login-form" aria-describedby="login-instructions" novalidate>
        <label for="username-input">Username</label>
        <input type="text" id="username-input" name="username" autocomplete="username" required aria-required="true" />
        
        <label for="password-input">Password</label>
        <input type="password" id="password-input" name="password" autocomplete="current-password" required aria-required="true" />
        
        <button type="submit">Login</button>
      </form>
      <p id="login-instructions" style="font-size:0.8rem; color:#888; margin-top:0.5rem;">Enter your login credentials above.</p>
    </section>
  </div>

  <script>
    (() => {
      const navButtons = {
        home: document.getElementById('nav-home'),
        sales: document.getElementById('nav-sales'),
        orders: document.getElementById('nav-orders'),
      };
      const pageContent = document.getElementById('page-content');
      const loginForm = document.getElementById('login-form');

      const pages = {
        home: {
          title: 'Welcome to the Company Portal',
          content: 'This is the home page. Use the navigation above to switch between Sales and Orders pages.',
        },
        sales: {
          title: 'Sales Overview',
          content: 'Here you can view all sales data, reports, and analytics. Stay updated with the latest numbers and trends.',
        },
        orders: {
          title: 'Order Management',
          content: 'Manage customer orders, track shipment status, and update order details in this section.',
        }
      };

      function setActivePage(pageKey) {
        // Update nav buttons
        for (const key in navButtons) {
          if (navButtons.hasOwnProperty(key)) {
            if (key === pageKey) {
              navButtons[key].classList.add('active');
              navButtons[key].setAttribute('aria-current', 'page');
            } else {
              navButtons[key].classList.remove('active');
              navButtons[key].removeAttribute('aria-current');
            }
          }
        }
        // Update content
        const page = pages[pageKey];
        pageContent.innerHTML = \`
          <h1>\${page.title}</h1>
          <p>\${page.content}</p>
        \`;
        // Focus for accessibility
        pageContent.focus();
      }

      // Add click event listeners to navigation buttons
      Object.keys(navButtons).forEach(key => {
        navButtons[key].addEventListener('click', () => setActivePage(key));
      });

      // Login form handling
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const username = loginForm.username.value.trim();
        const password = loginForm.password.value.trim();

        if (!username || !password) {
          alert('Please enter both username and password.');
          return;
        }
        // Simulate login validation (in real app, backend API call required)
        if (username === 'employee' && password === 'password123') {
          alert('Login successful. Welcome, ' + username + '!');
          loginForm.reset();
        } else {
          alert('Invalid credentials. Please try again.');
          loginForm.password.value = '';
          loginForm.password.focus();
        }
      });
    })();
  </script>
</body>
</html>
